name: Publish Nuget Package

on:
  push:
    tags:
      # Library releases use their own tag series; server/agent releases (v*) must not publish the package.
      - 'lib-v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require a 2.0+ library tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^lib-v([0-9]+)\. ]] || (( BASH_REMATCH[1] < 2 )); then
            echo "Tag $GITHUB_REF_NAME is not a lib-v2.0.0+ release tag"
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release ./lib/Nefarius.Utilities.ExceptionEnricher.csproj

      - name: Make Nuget Packages
        run: dotnet pack -c Release ./lib/Nefarius.Utilities.ExceptionEnricher.csproj

      - name: Publish To Nuget
        run: dotnet nuget push ./lib/artifacts/*.nupkg -k $NUGET_AUTH_TOKEN -s https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}
