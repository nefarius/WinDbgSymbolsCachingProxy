services:
  wdscp-app:
    image: nefarius.azurecr.io/wdscp:latest
    container_name: wdscp-app
    restart: unless-stopped
    depends_on:
      wdscp-db:
        condition: service_healthy
    volumes:
      # Named volumes inherit the image's ownership (appuser); host bind mounts would be root-owned and not writable.
      # If you prefer bind mounts, chown the host directories to the container user's uid/gid first.
      - wdscp-logs:/app/logs
      # ASP.NET Core Data Protection keys (keeps users logged in across container re-creation)
      - wdscp-keys:/data/keys
    environment:
      - TZ=Europe/Vienna
      # The image listens on 8080 (ASPNETCORE_HTTP_PORTS); there is no baked-in appsettings.Production.json.
      - ServiceConfig__ConnectionString=mongodb://wdscp-db:27017/
      # Replace the default Basic-auth credentials before exposing the service:
      # - ServiceConfig__BasicAuthCredentials__0__Username=changeme
      # - ServiceConfig__BasicAuthCredentials__0__Password=changeme
    networks:
      - database
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.wdscp-app.rule=Host(`symbols.nefarius.at`)
      - traefik.http.routers.wdscp-app.entrypoints=web-secure
      - traefik.http.routers.wdscp-app.tls=true
      - traefik.http.routers.wdscp-app.tls.certresolver=le
      - traefik.http.services.wdscp-app.loadbalancer.server.port=8080
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  wdscp-db:
    # Upgrading an existing data directory: MongoDB only supports stepping one major version at a time.
    # From 5.x go 5 -> 6 -> 7 -> 8: start each intermediate image, wait until it is healthy, and set
    # `db.adminCommand({ setFeatureCompatibilityVersion: "<version>", confirm: true })` before switching to the next.
    # Take a backup first. Fresh deployments can use this tag as is.
    image: mongo:8
    container_name: wdscp-db
    restart: unless-stopped
    volumes:
      - ./data/mongo/db:/data/db
      - ./data/mongo/config:/data/configdb
    environment:
      - TZ=Europe/Vienna
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - database
    labels:
      - traefik.enable=false
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  wdscp-db-ui:
    image: nefarius.azurecr.io/mongo-express:latest
    container_name: wdscp-db-ui
    restart: unless-stopped
    depends_on:
      wdscp-db:
        condition: service_healthy
    environment:
      - TZ=Europe/Vienna
      - ME_CONFIG_MONGODB_URL=mongodb://wdscp-db:27017/
      # Generate your own random secrets; do not reuse these placeholders.
      - ME_CONFIG_SITE_COOKIESECRET=change-me-cookie-secret
      - ME_CONFIG_SITE_SESSIONSECRET=change-me-session-secret
    networks:
      - database
    ports:
      - "127.0.0.1:8086:8081"
    labels:
      - traefik.enable=false
    logging:
      driver: "none"

networks:
  database:
  web:
    external: true

volumes:
  wdscp-logs:
  wdscp-keys:
